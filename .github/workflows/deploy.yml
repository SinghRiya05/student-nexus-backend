name: Deploy to EC2 (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            BASE_DIR="/var/www/html/myapp"

            mkdir -p $BASE_DIR
            cd $BASE_DIR

            echo "Clean old folders"
            rm -rf student-nexus-backend
            rm -rf student-nexus-frontend

            echo "Cloning backend"
            git clone git@github.com:SinghRiya05/student-nexus-backend.git

            echo "Cloning frontend"
            git clone git@github.com:SinghRiya05/student-nexus-frontend.git

            echo "Restart Docker"
            cd student-nexus-backend
            docker-compose down || true
            docker-compose up -d --build