name: Deploy Backend to EC2

on:
  push:
    branches:
      - main   # or main (match your repo)

jobs:
  deploy:
    name: Deploy Backend 
    runs-on: ubuntu-latest

    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Go to backend project folder
            cd /var/www/html/myapp/backend

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm install

            # Restart or start backend with PM2
            pm2 restart backend-app || pm2 start index.js --name "backend-app"

            # Reload environment variables for PM2
            pm2 restart backend-app --update-env

            # Save PM2 process list
            pm2 save